# Durcissement Apache (issue #14). Nom en "zz-" : chargé APRÈS conf-enabled/security.conf de Debian.
# Installation :
#   sudo cp config/apache/zz-ban-hackers-hardening.conf /etc/apache2/conf-available/
#   sudo a2enmod headers && sudo a2enconf zz-ban-hackers-hardening
#   sudo apache2ctl configtest && sudo systemctl reload apache2

# Ne pas révéler la version d'Apache/de l'OS
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Pas de listing de répertoires
<Directory /var/www/>
    Options -Indexes
</Directory>

# Fichiers cachés (.env, .git, .htpasswd, .DS_Store...) interdits, sauf .well-known (Let's Encrypt)
<LocationMatch "/\.(?!well-known/)">
    Require all denied
</LocationMatch>

# Sauvegardes, dumps et fichiers de dépendances jamais servis.
# Si vos sites ne proposent pas d'archives en téléchargement, ajoutez aussi : |zip|7z|tar|tar\.gz|tgz
<FilesMatch "(?i)\.(bak|backup|old|orig|save|swp|swo|sql|sql\.gz|log|ini|sh|dist)$|~$|^(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Dockerfile|docker-compose\.ya?ml)$">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By
    Header unset X-Powered-By
</IfModule>
