# Durcissement SSH (issue #14).
# ⚠️ AVANT d'installer : vérifiez que vous vous connectez bien par CLÉ (ssh -i ...),
#    sinon vous perdrez l'accès. Gardez une session ouverte pendant le test.
# Installation :
#   sudo cp config/ssh/99-ban-hackers.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh
#   (puis tester une NOUVELLE connexion avant de fermer la session en cours)

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# root uniquement par clé (mettre "no" si vous utilisez un compte sudo)
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
